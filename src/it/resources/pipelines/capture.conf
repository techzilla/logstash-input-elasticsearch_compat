input {
  elasticsearch_compat { id => "it_input" port => 9200 tags => ["t1"] add_field => { "f1" => "v1" } }
  elasticsearch_compat { id => "it_custom" port => 9201 metadata_target => "[@metadata][custom]" }
}
filter {
  if [@metadata][elasticsearch_compat] { mutate { copy => { "[@metadata][elasticsearch_compat]" => "[_meta]" } } }
  if [@metadata][custom] { mutate { copy => { "[@metadata][custom]" => "[_custom]" } } }
  if [@metadata][own] { mutate { copy => { "[@metadata][own]" => "[_own]" } } }
}
output { file { path => "/out/events.ndjson" codec => json_lines flush_interval => 0 } }
