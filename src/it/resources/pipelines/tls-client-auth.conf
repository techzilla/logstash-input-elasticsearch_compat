input { elasticsearch_compat { port => 9200 ssl_enabled => true ssl_certificate => "/usr/share/logstash/tls/server.crt" ssl_key => "/usr/share/logstash/tls/server.key" ssl_client_authentication => "required" ssl_certificate_authorities => ["/usr/share/logstash/tls/ca.crt"] } }
filter { if [@metadata][elasticsearch_compat] { mutate { copy => { "[@metadata][elasticsearch_compat]" => "[_meta]" } } } }
output { file { path => "/out/events.ndjson" codec => json_lines flush_interval => 0 } }
