# Run with PIPELINE_WORKERS=1 PIPELINE_BATCH_SIZE=1 (env), memory queue.
input  { elasticsearch_compat { port => 9200 threads => 1 max_pending_requests => 2 max_content_length => 4096 } }
filter { if [message] == "block" { sleep { time => 3600 } } }
output { file { path => "/out/events.ndjson" codec => json_lines flush_interval => 0 } }
